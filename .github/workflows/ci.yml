name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# 取消进行中的同分支重复 run, 节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meal_planner_test
          MYSQL_USER: meal
          MYSQL_PASSWORD: meal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u root -proot" --health-interval=10s
          --health-timeout=5s --health-retries=10
    # 这里是一组**一次性**的容器凭据: mysql:8.0 服务容器随 job 销毁,
    # 与服务本身的凭据无关, 所以明文写在 workflow 里 (不是生产密钥)。
    # 生产凭据永远走 APP__DATABASE__URL 环境变量 / .env, 不进版本库。
    env:
      CI_DB_USER: meal
      CI_DB_PASSWORD: meal
      CI_DB_NAME: meal_planner_test
      CI_DB_PORT: "3306"
      APP__DATABASE__URL: mysql+aiomysql://meal:meal@127.0.0.1:3306/meal_planner_test?charset=utf8mb4
      # ⚠ 集成测试读的是 TEST_DATABASE_URL, 不是 APP__DATABASE_URL。
      # 漏了这一行, 142 条需要 MySQL 的用例会全部 skip —— CI 照样绿, 但集成层一行没跑。
      # (skip 是 absence 不是 presence: 绿 ≠ 覆盖)
      TEST_DATABASE_URL: mysql+aiomysql://meal:meal@127.0.0.1:3306/meal_planner_test?charset=utf8mb4
      APP__AUTH__JWT_SECRET: ci-test-secret-not-for-production-use
      APP__APP__DEBUG: "true"
      APP__APP__CORS_ORIGINS: "[]"
      APP__APP__NAME: meal-planner-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps
        # ⚠ 这里原来装的是 backend/ai_meal_planner.egg-info/requires.txt ——
        #   但 `.gitignore` 里有 `*.egg-info/`, 这个文件**根本不在版本库里**,
        #   于是 pip 必然失败, 又被 `|| true` 吞掉 —— 后端依赖一次都没装上,
        #   后面的 alembic 就以 `ModuleNotFoundError: No module named 'yaml'` 崩掉。
        #   包的定义在**仓库根**的 pyproject.toml, 所以从根目录 -e ".[dev]" 装。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff
        working-directory: backend
        # 这里曾经是 `ruff check app tests || true` —— `|| true` 让 lint 永远"看起来是绿的",
        # 于是 F821(未定义名) 这类**运行时必崩**的问题一直活在主线。
        # 2026-10-12 就靠摘掉它抓出两个: api/decide.py 的 status 未导入、
        # inventory_service.py 的 user.id(应为 user_id)。**别把 || true 加回来**。
        run: |
          pip install ruff
          ruff check .
      - name: Alembic migrations on MySQL 8.0
        # 迁移链最容易坏在"本地 SQLite 能过、MySQL 上过不去"。
        # 这里升到 head 再一路 downgrade 回 base 再升回来, 同时验证可升级与可回滚。
        working-directory: backend
        run: |
          python -m pip install -q alembic
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Run pytest
        working-directory: backend
        # 依赖已经在 "Install backend deps" 里按 pyproject 的 [dev] 装好了
        # (pytest / pytest-asyncio / httpx / aiosqlite 都在里面)。
        # 这里**不要再 pip install 一份** —— 手写的那一份会和 pyproject 漂移:
        # 曾经就漏了 aiosqlite, 于是 test_decision_context_real_chain.py
        # 在本地全绿、在 CI 上以 ModuleNotFoundError 报 error。
        # 测试依赖的唯一真源是 pyproject.toml。
        #
        # ⚠ 这里曾经带 `-x`(遇错即停)。门禁里不要用它 —— 一条失败就把后面所有失败
        #   藏起来了, 你永远只能看见"第一个"问题, 修完再推, 再看见下一个,
        #   一次 CI 只暴露一个 bug。全量跑完才能一次看清全貌。
        run: |
          pytest tests/ --tb=short -q

  shared-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check design tokens
        run: |
          node scripts/gen_tokens.mjs --check
      - name: Check logo assets
        run: |
          node scripts/gen_logo.mjs --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        # ⚠ 这里曾经是 `npm ci || npm install` —— 兜底会把"锁文件和 package.json 不一致"
        #   这件**必须暴露**的事悄悄抹平: npm ci 失败 → 退回到 npm install 重新解析 →
        #   装出一个和锁文件完全不同的依赖树, 构建问题就变得既难复现又难归因。
        #   2026-10-12 撞到的正是这个: vite/vitest 在锁里是 6.x/2.x, package.json 要
        #   7.x/3.x, npm ci 本该报错, 却被兜底吞掉。**锁文件漂移必须红, 不许绿。**
        run: npm ci
      - name: Lint
        run: npm run lint --silent
      - name: Test (vitest)
        run: npm run test --silent
      - name: Build
        run: npm run build --silent

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Install
        # 同 frontend: `npm ci` 不许带 `|| npm install` 兜底 (理由见 frontend 那条注释)。
        #
        # 另外 miniapp 的 webpack 必须在 `~5.104.0` 这条窄区间里, 不是随手写的:
        #   · 下限 5.94.0 —— webpack <5.94 有已知漏洞, 不能降
        #   · 上限 5.105 —— 5.106 起 ProgressPlugin 的 options 校验从构造函数挪到了
        #     apply(); 而 Taro 4.2.1 用的 webpackbar@5 会在 super() 之后把
        #     this.options 整个覆写成自己的配置(name/color/reporters/...),
        #     于是新版 webpack 一校验就 ValidationError。Taro 的 peerDependency
        #     又把 webpack 钉在 5.91.0 —— 这个死锁只能在"够新且够旧"的窗口里解。
        # 改这个版本前先跑一遍 build:weapp, 别只看 CI 绿。
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --silent
      - name: Build weapp
        run: npm run build:weapp --silent
      - name: Build h5
        run: npm run build:h5 --silent
