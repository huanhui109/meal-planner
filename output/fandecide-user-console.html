<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>饭决 · 用户操作台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<!-- 样式沿用项目唯一真源 shared/tokens.ts 生成的 CSS 变量 -->
<style>
:root{
  --color-bg:#FBF9F4; --color-screen:#FFFFFF; --color-card:#FFFFFF;
  --color-ink:#2C2C2A; --color-ink2:#6B6B6B; --color-ink3:rgba(0,0,0,.20);
  --color-line:rgba(0,0,0,.10); --color-fill:#F2EDE4; --color-on-ink:#FFFFFF;
  --color-accent:#34c759; --color-accent-ink:#1e7d3c; --color-accent-soft:rgba(52,199,89,.12);
  --color-warn:#E0955A; --color-warn-ink:#A8642F; --color-warn-soft:rgba(224,149,90,.15);
  --color-danger:#ff3b30; --color-danger-soft:rgba(255,59,48,.12);
  --color-glass:rgba(255,254,250,.82); --color-ink-disabled:rgba(0,0,0,.20);
  --radius-xl:28px; --radius-lg:22px; --radius-md:16px; --radius-sm:12px; --radius-pill:999px;
  --font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --font-title:29px; --font-heading:19px; --font-body:15px; --font-label:13px;
  --font-caption:12px; --font-micro:11px; --font-number:26px;
  --font-tracking:-.01em; --font-tracking-tight:-.03em;
  --shadow-card:0 1px 2px rgba(0,0,0,.025),0 10px 30px -18px rgba(0,0,0,.12);
  --shadow-float:0 12px 32px -12px rgba(0,0,0,.18);
  --motion-ease:cubic-bezier(.22,.9,.3,1); --motion-press:.965; --motion-fast:.14s; --motion-base:.24s;
  --layout-page-max:1120px; --layout-tabbar-height:74px; --layout-tap-target:44px;
  --brand-pan:#3b4048; --brand-pan-rim:#6b7280; --brand-pan-inner:#2b2f35; --brand-pan-light:#e8e8ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-ink);font-family:var(--font-family);
  font-size:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:var(--font-tracking)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:var(--font-tracking-tight)}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--color-ink)}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.app{min-height:100vh;display:flex;flex-direction:column}
.page{width:100%;max-width:var(--layout-page-max);margin:0 auto;padding:0 20px 40px}
.appbar{position:sticky;top:0;z-index:50;background:var(--color-glass);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--color-line)}
.appbar-in{max-width:var(--layout-page-max);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:0 0 34px;border-radius:var(--radius-sm);background:var(--color-fill);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--color-line)}
.appbar-t{font-size:var(--font-heading);font-weight:700;letter-spacing:var(--font-tracking-tight)}
.appbar-s{font-size:var(--font-caption);color:var(--color-ink2)}
.appbar-sp{flex:1 1 auto}
.conn{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border-radius:var(--radius-pill);
  background:var(--color-fill);border:1px solid var(--color-line);font-size:var(--font-caption);font-weight:600}
.conn .d{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--color-ink-disabled)}
.conn.ok .d{background:var(--color-accent)}
.conn.err .d{background:var(--color-danger)}
.conn.load .d{background:var(--color-warn)}
.navbar{position:sticky;top:56px;z-index:40;background:var(--color-bg);padding:12px 0 4px}
.navbar-in{max-width:var(--layout-page-max);margin:0 auto;padding:0 20px;display:flex;gap:8px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.navbar-in::-webkit-scrollbar{display:none}
.navitem{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:var(--layout-tap-target);
  padding:0 16px;border-radius:var(--radius-pill);background:var(--color-card);
  border:1px solid var(--color-line);font-size:var(--font-label);font-weight:600;color:var(--color-ink2);
  transition:transform var(--motion-fast) var(--motion-ease),background var(--motion-fast)}
.navitem.on{background:var(--color-ink);color:var(--color-on-ink);border-color:var(--color-ink)}
.navitem:active{transform:scale(var(--motion-press))}
.head{padding:18px 0 6px}
.head h1{font-size:var(--font-title);line-height:1.2}
.head p{color:var(--color-ink2);font-size:var(--font-label);margin-top:6px}
.card{background:var(--color-card);border:1px solid var(--color-line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:18px;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:var(--font-heading)}
.card-h .sp{flex:1 1 auto}
.hint{font-size:var(--font-caption);color:var(--color-ink2);line-height:1.65}
.mono{font-size:var(--font-caption)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.panel{display:none}
.panel.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--layout-tap-target);
  padding:0 18px;border-radius:var(--radius-pill);border:1px solid var(--color-line);
  background:var(--color-card);color:var(--color-ink);font-size:var(--font-body);font-weight:600;
  transition:transform var(--motion-fast) var(--motion-ease),opacity var(--motion-fast)}
.btn:active{transform:scale(var(--motion-press))}
.btn.primary{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-on-ink)}
.btn.ghost{background:var(--color-fill);border-color:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:var(--font-label)}
.btn.danger{color:var(--color-danger);border-color:rgba(255,59,48,.3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:0 0 16px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.frow{display:flex;flex-direction:column;gap:6px;padding:9px 0}
.frow .lb{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.frow .nm{font-size:var(--font-label);font-weight:600}
.frow .req{color:var(--color-danger);font-size:var(--font-caption)}
.frow .ds{font-size:var(--font-caption);color:var(--color-ink2);line-height:1.5}
.frow input,.frow select,.frow textarea{width:100%;min-height:var(--layout-tap-target);padding:10px 13px;
  border:1px solid var(--color-line);border-radius:var(--radius-sm);background:var(--color-screen);outline:none}
.frow textarea{min-height:76px;resize:vertical;line-height:1.6}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--color-ink)}
.frow.invalid input,.frow.invalid select,.frow.invalid textarea{border-color:var(--color-danger);background:rgba(255,59,48,.04)}
.frow .err{font-size:var(--font-caption);color:var(--color-danger);display:none}
.frow.invalid .err{display:block}
.sw{display:inline-flex;align-items:center;gap:9px;min-height:var(--layout-tap-target)}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:46px;height:28px;flex:0 0 46px;border-radius:var(--radius-pill);background:var(--color-ink-disabled);
  position:relative;transition:background var(--motion-fast)}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform var(--motion-base) var(--motion-ease);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sw input:checked + .tr{background:var(--color-accent)}
.sw input:checked + .tr::after{transform:translateX(18px)}
.sw .tl{font-size:var(--font-label);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--font-micro);font-weight:700;
  padding:3px 9px;border-radius:var(--radius-pill);letter-spacing:.02em;white-space:nowrap}
.tag.g{background:var(--color-accent-soft);color:var(--color-accent-ink)}
.tag.w{background:var(--color-warn-soft);color:var(--color-warn-ink)}
.tag.r{background:var(--color-danger-soft);color:var(--color-danger)}
.tag.n{background:var(--color-fill);color:var(--color-ink2)}
.tag.k{background:var(--color-ink);color:var(--color-on-ink)}
.mth{font-size:var(--font-micro);font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.mth.GET{background:var(--color-accent-soft);color:var(--color-accent-ink)}
.mth.POST{background:var(--color-warn-soft);color:var(--color-warn-ink)}
.mth.PUT{background:rgba(0,122,255,.10);color:#0057b8}
.mth.DELETE{background:var(--color-danger-soft);color:var(--color-danger)}
.op{border:1px solid var(--color-line);border-radius:var(--radius-md);background:var(--color-card);
  margin-bottom:12px;overflow:hidden}
.op-h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:13px 15px;min-height:52px}
.op-h:hover{background:rgba(0,0,0,.015)}
.op-h .ico{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--color-fill);
  display:flex;align-items:center;justify-content:center}
.op-h .ttl{font-size:var(--font-body);font-weight:650}
.op-h .path{font-size:var(--font-caption);color:var(--color-ink2);overflow-wrap:anywhere}
.op-h .sp{flex:1 1 auto}
.op-h .arw{transition:transform var(--motion-base) var(--motion-ease);flex:0 0 15px}
.op.open .op-h .arw{transform:rotate(90deg)}
.op-b{display:none;padding:2px 15px 15px;border-top:1px solid var(--color-line)}
.op.open .op-b{display:block}
.op-res{margin-top:12px}
.res{border-radius:var(--radius-md);border:1px solid var(--color-line);overflow:hidden}
.res.ok{border-color:rgba(52,199,89,.34);background:var(--color-accent-soft)}
.res.err{border-color:rgba(255,59,48,.30);background:var(--color-danger-soft)}
.res.warn{border-color:rgba(224,149,90,.34);background:var(--color-warn-soft)}
.res-h{display:flex;align-items:center;gap:9px;padding:11px 13px;flex-wrap:wrap}
.res-h .st{font-size:var(--font-label);font-weight:700}
.res.ok .st{color:var(--color-accent-ink)}
.res.err .st{color:var(--color-danger)}
.res.warn .st{color:var(--color-warn-ink)}
.res-h .meta{font-size:var(--font-caption);color:var(--color-ink2)}
.res-h .sp{flex:1 1 auto}
.res-b{padding:0 13px 12px}
.res-msg{font-size:var(--font-body);line-height:1.6;padding:0 13px 10px;word-break:break-word}
.res-sum{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 10px}
.kv{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:var(--radius-sm);
  background:var(--color-screen);border:1px solid var(--color-line);min-width:104px;flex:1 1 104px}
.kv .k{font-size:var(--font-micro);color:var(--color-ink2)}
.kv .v{font-size:var(--font-label);font-weight:700;overflow-wrap:anywhere}
pre.json{margin:0;padding:12px;background:var(--color-screen);border-top:1px solid var(--color-line);
  font-size:var(--font-caption);line-height:1.55;overflow:auto;max-height:320px;white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere}
.toggle-json{font-size:var(--font-caption);font-weight:600;color:var(--color-ink2);padding:6px 0}
.empty-state{text-align:center;padding:26px 14px;color:var(--color-ink2);font-size:var(--font-label)}
.skel{height:12px;border-radius:6px;background:var(--color-fill);margin:8px 0;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.spin{width:15px;height:15px;flex:0 0 15px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--color-ink);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-line)}
.row:last-child{border-bottom:0}
.row .rf{flex:1 1 auto;min-width:0}
.row .rt{font-size:var(--font-body);font-weight:600}
.row .rd{font-size:var(--font-caption);color:var(--color-ink2);overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--color-ink);color:var(--color-on-ink);padding:11px 20px;border-radius:var(--radius-pill);
  font-size:var(--font-label);font-weight:600;opacity:0;pointer-events:none;z-index:99;
  transition:opacity var(--motion-base) var(--motion-ease),transform var(--motion-base) var(--motion-ease);
  max-width:86vw;text-align:center;box-shadow:var(--shadow-float)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.show{display:flex}
.modal{background:var(--color-card);border-radius:var(--radius-lg);padding:22px;max-width:420px;width:100%;
  box-shadow:var(--shadow-float)}
.modal h3{font-size:var(--font-heading);margin-bottom:8px}
.modal p{font-size:var(--font-body);color:var(--color-ink2);line-height:1.65;overflow-wrap:anywhere}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:860px){
  .g3,.g2{grid-template-columns:1fr}
  .page{padding:0 14px 60px}
  .appbar-in{padding:9px 14px}
  .navbar-in{padding:0 14px}
  .navbar{top:52px}
  .head h1{font-size:24px}
  .card{padding:15px;border-radius:var(--radius-md)}
}
@media (max-width:400px){.navitem{padding:0 13px;font-size:var(--font-caption)}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="appbar-in">
      <div class="logo" id="logoBox"></div>
      <div>
        <div class="appbar-t">饭决 · 用户操作台</div>
        <div class="appbar-s" id="appbarSub">未连接</div>
      </div>
      <div class="appbar-sp"></div>
      <button class="conn" id="connChip" data-act="goto" data-tab="connect">
        <span class="d"></span><span id="connTxt">未连接</span>
      </button>
    </div>
  </header>

  <nav class="navbar"><div class="navbar-in" id="nav"></div></nav>

  <main class="page">
    <section class="panel on" id="panel-connect">
      <div class="head"><h1>连接与身份</h1>
        <p>先把操作台接到后端并完成登录，其余能力才会解锁——所有请求都走真实 API</p></div>
      <div id="connectBody"></div>
    </section>

    <section class="panel" id="panel-decide">
      <div class="head"><h1>今天吃啥</h1>
        <p>决策引擎与今日聚合：一次点击出结果，并给出口服的理由与做法</p></div>
      <div id="decideBody"></div>
    </section>

    <section class="panel" id="panel-menu">
      <div class="head"><h1>周菜单与采购</h1>
        <p>生成 / 查看 / 编辑菜单，取采购清单与补单建议</p></div>
      <div id="menuBody"></div>
    </section>

    <section class="panel" id="panel-fridge">
      <div class="head"><h1>冰箱库存</h1>
        <p>库存增删查、临期提醒，以及拍照识别入库</p></div>
      <div id="fridgeBody"></div>
    </section>

    <section class="panel" id="panel-pref">
      <div class="head"><h1>偏好档案</h1>
        <p>口味档案即约束：这些设定直接决定决策结果与菜单内容</p></div>
      <div id="prefBody"></div>
    </section>

    <section class="panel" id="panel-more">
      <div class="head"><h1>更多能力</h1>
        <p>反馈、邀请、订阅消息、飞书自动化、商品查询与系统状态</p></div>
      <div id="moreBody"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mkTitle">确认</h3>
    <p id="mkBody"></p>
    <div class="acts"><button class="btn" id="mkNo">取消</button><button class="btn primary" id="mkYes">确定</button></div>
  </div>
</div>

<script>

function splitList(s){
  return String(s||"").split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean);
}
/* ========================= 计算层：API 客户端 ========================= */
var REQ_TIMEOUT = 20000;

/* 取某能力某字段的当前值（含动态默认来源） */
function fieldVal(cap, f){
  var key = cap.id + "." + f.k;
  var v = state.formVals[key];
  if(v===undefined || v===null || v===""){
    if(f.dyn==="lastDecision") v = state.lastDecisionId!=null ? String(state.lastDecisionId) : "";
    else if(f.dyn==="currentMenu") v = state.currentMenuId!=null ? String(state.currentMenuId) : "";
    else if(f.dyn==="lastTask") v = state.formVals["menuTask.task_id"] || "";
    else v = (f.d!==undefined && f.d!==null) ? String(f.d) : "";
  }
  return v;
}

/* 校验：必填与类型 */
function validate(cap, vals){
  var errs = {};
  var list = cap.f || [];
  for(var i=0;i<list.length;i++){
    var f = list[i], v = vals[f.k];
    if(f.req && (v===undefined || v===null || String(v).trim()==="")){
      errs[f.k] = "这一项必填";
      continue;
    }
    if(f.t==="number" && v!=="" && v!=null && isNaN(parseFloat(v))){
      errs[f.k] = "需要填数字";
    }
  }
  return errs;
}

/* 构造最终路径（替换 {xxx} 占位） */
function buildPath(cap, vals){
  var p = cap.p;
  var m = p.match(/\{([a-zA-Z0-9_]+)\}/g) || [];
  for(var i=0;i<m.length;i++){
    var name = m[i].slice(1,-1);
    var v = vals[name];
    if(v===undefined || v===null || v==="") v = "";
    p = p.replace(m[i], encodeURIComponent(String(v)));
  }
  return p;
}

/* 归一化响应 —— 成功/失败的唯一判定口 */
function normalize(http, json, ms, raw){
  var out = {http:http, ms:ms, raw:raw, data:null, message:"", code:null, ok:false, level:"err"};
  if(json && typeof json === "object"){
    if("code" in json){
      out.code = json.code;
      out.ok = (http>=200 && http<300 && json.code === 0);
      out.data = json.data;
      out.message = json.message || (out.ok ? "成功" : "请求未成功");
      out.level = out.ok ? "ok" : "err";
    } else if("detail" in json){
      /* FastAPI 的 HTTPException：{"detail": "..."} */
      out.code = http;
      out.message = typeof json.detail === "string" ? json.detail : JSON.stringify(json.detail);
      out.data = json;
      out.ok = false;
      out.level = (http===429 || http===503) ? "warn" : "err";
    } else {
      out.ok = (http>=200 && http<300);
      out.data = json;
      out.message = out.ok ? "成功" : "HTTP " + http;
      out.level = out.ok ? "ok" : "err";
    }
  } else {
    out.ok = (http>=200 && http<300);
    out.data = json;
    out.message = out.ok ? "成功" : ("HTTP " + http + "（响应不是 JSON，可能被代理或网关拦截）");
    out.level = out.ok ? "ok" : "err";
  }
  return out;
}

/* 真实发起请求 */
function apiRaw(method, path, body, opts, cb){
  opts = opts || {};
  var url = state.base.replace(/\/+$/,"") + path;
  if(opts.query){
    var qs = [];
    for(var k in opts.query){ if(Object.prototype.hasOwnProperty.call(opts.query,k))
      qs.push(encodeURIComponent(k)+"="+encodeURIComponent(opts.query[k])); }
    if(qs.length) url += (url.indexOf("?")>=0?"&":"?") + qs.join("&");
  }
  var t0 = Date.now();
  var ctrl = null, timer = null;
  if(window.AbortController){ ctrl = new AbortController(); timer = setTimeout(function(){ ctrl.abort(); }, REQ_TIMEOUT); }
  var init = {method:method, headers:{}};
  if(ctrl) init.signal = ctrl.signal;
  if(state.token) init.headers["Authorization"] = "Bearer " + state.token;
  if(opts.multipart){
    var fd = new FormData();
    for(var fk in body){ if(Object.prototype.hasOwnProperty.call(body,fk)) fd.append(fk, body[fk]); }
    init.body = fd;                       /* 不设 Content-Type，让浏览器带 boundary */
  } else if(body!=null && method!=="GET"){
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  fetch(url, init).then(function(resp){
    return resp.text().then(function(txt){
      var json = null;
      try{ json = txt ? JSON.parse(txt) : null; }catch(e){ json = null; }
      cb(normalize(resp.status, json, Date.now()-t0, txt));
    });
  }).catch(function(err){
    var name = err && err.name ? err.name : "";
    var msg = name === "AbortError"
      ? "请求超时（超过 " + (REQ_TIMEOUT/1000) + " 秒没响应）"
      : "连不上后端：" + (err && err.message ? err.message : "网络错误");
    cb({http:0, ms:Date.now()-t0, raw:null, data:null, message:msg, code:null, ok:false, level:"err", net:true});
  }).then(function(){ if(timer) clearTimeout(timer); });
}

/* 静默请求（联动刷新用，不改 UI 状态） */
function apiSilent(method, path, body, cb){
  apiRaw(method, path, body, {}, cb || function(){});
}

/* 执行一个能力卡：校验 → 请求 → 回调 */
function runCap(cap, cb){
  var vals = {};
  var list = cap.f || [];
  for(var i=0;i<list.length;i++){ vals[list[i].k] = fieldVal(cap, list[i]); }

  var errs = validate(cap, vals);
  if(Object.keys(errs).length){ cb({validation:errs}); return; }

  var body = null;
  if(cap.multipart){
    body = {};
    for(var j=0;j<list.length;j++){ body[list[j].k] = vals[list[j].k]; }
  } else if(typeof cap.body === "function"){
    body = cap.body(vals);
  }
  var opts = {};
  if(typeof cap.query === "function"){
    var q = cap.query(vals);
    if(q) opts.query = q;
  }
  if(cap.multipart) opts.multipart = true;

  apiRaw(cap.m, buildPath(cap, vals), body, opts, cb);
}

/* 生成任务轮询：最多 30 次，每 2 秒一次 */
var pollTimer = null;
function pollTask(taskId){
  if(pollTimer) clearInterval(pollTimer);
  var n = 0;
  pollTimer = setInterval(function(){
    n++;
    if(n > 30){ clearInterval(pollTimer); pollTimer = null; toast("生成超时，请到「查询生成进度」手动查看"); return; }
    apiSilent("GET", "/api/menus/generation-tasks/" + encodeURIComponent(taskId), null, function(r){
      var st = r.data && r.data.status ? r.data.status : null;
      if(st === "done"){
        clearInterval(pollTimer); pollTimer = null;
        toast("菜单生成完成");
        if(r.data && r.data.menu_id){ state.currentMenuId = r.data.menu_id; }
        loadMenuItems();
        refreshAll();
      } else if(st === "failed"){
        clearInterval(pollTimer); pollTimer = null;
        toast("菜单生成失败：" + ((r.data && r.data.error) || "未知原因"));
        refreshAll();
      }
    });
  }, 2000);
}

/* 拉当前菜单的餐次，供「换一道 / 锁定 / 标记已做」选择 */
function loadMenuItems(){
  if(!state.token){ state.menuItems = []; refreshAll(); return; }
  apiSilent("GET", "/api/menus/current", null, function(r){
    if(r.ok && r.data){
      state.currentMenuId = r.data.id || state.currentMenuId;
      var items = r.data.menu_items || r.data.items || [];
      state.menuItems = items.map(function(it){
        var name = it.recipe_name || (it.recipe && it.recipe.name) || ("餐次 #" + it.id);
        return {v:String(it.id), t:name};
      });
    } else {
      state.menuItems = [];
    }
    refreshAll();
  });
}

/* 拉库存条目 */
function loadInventory(){
  if(!state.token){ state.inventory = []; refreshAll(); return; }
  apiSilent("GET", "/api/inventory", null, function(r){
    state.inventory = (r.ok && r.data && r.data.items) ? r.data.items : [];
    refreshAll();
  });
}
/* ========================= 渲染层 1：能力卡 ========================= */
function fmtVal(v){
  if(v===null || v===undefined) return "—";
  if(typeof v === "boolean") return v ? "是" : "否";
  if(typeof v === "object") return Array.isArray(v) ? (v.length + " 项") : "对象";
  return String(v);
}
/* 按 keys 取嵌套字段（支持 a.b） */
function pickPath(obj, p){
  var cur = obj;
  var parts = p.split(".");
  for(var i=0;i<parts.length;i++){
    if(cur===null || cur===undefined || typeof cur !== "object") return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
/* 结果摘要：优先用 keys，否则自动挑标量字段（至多 4 个） */
function summaryOf(cap, data){
  var out = [];
  if(data===null || data===undefined) return out;
  if(cap.keys){
    for(var i=0;i<cap.keys.length;i++){
      var v = pickPath(data, cap.keys[i]);
      if(v!==undefined && v!==null && v!=="") out.push({k:cap.keys[i], v:fmtVal(v)});
    }
    if(out.length) return out;
  }
  if(typeof data === "object" && !Array.isArray(data)){
    var n = 0;
    for(var k in data){
      if(!Object.prototype.hasOwnProperty.call(data,k)) continue;
      var val = data[k];
      if(val===null || typeof val === "string" || typeof val === "number" || typeof val === "boolean"){
        out.push({k:k, v:fmtVal(val)}); n++;
        if(n>=4) break;
      }
    }
    return out;
  }
  if(Array.isArray(data)) out.push({k:"条数", v:String(data.length)});
  return out;
}
/* 空数据判定：给一条温和提示 */
function isEmptyData(data){
  if(data===null || data===undefined) return true;
  if(Array.isArray(data)) return data.length===0;
  if(typeof data === "object"){
    if("total" in data && ("items" in data)) return (data.items||[]).length===0;
    return Object.keys(data).length===0;
  }
  return false;
}

function renderField(cap, f){
  var key = cap.id + "." + f.k;
  var v = fieldVal(cap, f);
  var html = '<div class="frow" data-frow="'+esc(key)+'"><div class="lb"><span class="nm">'+esc(f.l)+'</span>';
  if(f.req) html += '<span class="req">必填</span>';
  html += '</div>';

  if(f.t==="select" && f.from==="menuItems"){
    var opts = state.menuItems.length ? state.menuItems : [{v:"",t:"（还没有菜单，请先生成或刷新当前菜单）"}];
    html += '<select data-act="field" data-key="'+esc(key)+'">';
    for(var i=0;i<opts.length;i++) html += '<option value="'+esc(opts[i].v)+'"'+(String(v)===String(opts[i].v)?" selected":"")+'>'+esc(opts[i].t)+'</option>';
    html += '</select>';
  } else if(f.t==="select" && f.from==="inventory"){
    var inv = (state.inventory && state.inventory.length) ? state.inventory : null;
    html += '<select data-act="field" data-key="'+esc(key)+'">';
    if(!inv){ html += '<option value="">（还没有库存，请先新增或刷新列表）</option>'; }
    else {
      for(var j=0;j<inv.length;j++){
        var it = inv[j];
        var nm = it.ingredient_name || (it.ingredient && it.ingredient.name) || ("条目 " + it.id);
        var q = (it.quantity!=null? it.quantity : "") + (it.unit||"");
        html += '<option value="'+esc(String(it.id))+'"'+(String(v)===String(it.id)?" selected":"")+'>'+esc(nm+" · "+q)+'</option>';
      }
    }
    html += '</select>';
  } else if(f.t==="select"){
    html += '<select data-act="field" data-key="'+esc(key)+'">';
    var os = f.o || [];
    for(var k=0;k<os.length;k++) html += '<option value="'+esc(os[k])+'"'+(String(v)===String(os[k])?" selected":"")+'>'+esc(os[k]||"（留空）")+'</option>';
    html += '</select>';
  } else if(f.t==="bool"){
    html += '<label class="sw"><input type="checkbox" data-act="field-bool" data-key="'+esc(key)+'"'+(String(v)==="true"?" checked":"")+
      '><span class="tr"></span><span class="tl"></span></label>';
  } else if(f.t==="textarea"){
    html += '<textarea data-act="field" data-key="'+esc(key)+'" placeholder="'+esc(String(f.d||""))+'">'+esc(v)+'</textarea>';
  } else if(f.t==="file"){
    html += '<input type="file" accept="image/*" data-act="field-file" data-key="'+esc(key)+'">';
  } else {
    var tp = f.t==="number" ? "number" : (f.t==="date" ? "date" : "text");
    html += '<input type="'+tp+'" value="'+esc(v)+'" data-act="field" data-key="'+esc(key)+'"'+
      (f.t==="number"?' step="any"':'')+' placeholder="'+esc(String(f.d||""))+'">';
  }
  if(f.s) html += '<div class="ds">'+esc(f.s)+'</div>';
  html += '<div class="err"></div></div>';
  return html;
}

function renderOp(cap){
  var open = !!state.openOps[cap.id];
  var locked = (state.conn !== "ok") && PUBLIC_CAPS.indexOf(cap.id) < 0;
  var html = '<div class="op'+(open?" open":"")+'" data-cap="'+esc(cap.id)+'">'
    + '<button class="op-h" data-act="toggle-op" data-cap="'+esc(cap.id)+'">'
    + '<span class="ico">'+ic(cap.icon,16,"#2C2C2A")+'</span>'
    + '<span style="flex:1 1 auto;min-width:0">'
    +   '<span class="ttl">'+esc(cap.title)+'</span>'
    +   (cap.write? ' <span class="tag w">会写数据</span>':'')
    +   (cap.multipart? ' <span class="tag n">文件上传</span>':'')
    +   (locked? ' <span class="tag n">需先连接</span>':'')
    +   '<br><span class="path"><span class="mth '+cap.m+'">'+cap.m+'</span> '+esc(cap.p)+'</span>'
    + '</span>'
    + ic("dots",15,"#6B6B6B")
    + '<svg class="arw" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
    + '</button><div class="op-b">'
    + '<p class="hint" style="padding:10px 0 2px">'+esc(cap.desc)+'</p>';

  var list = cap.f || [];
  for(var i=0;i<list.length;i++) html += renderField(cap, list[i]);

  html += '<div class="btnrow" style="margin-top:12px">'
    + '<button class="btn '+(cap.danger?"danger":"primary")+'" data-act="run" data-cap="'+esc(cap.id)+'"'+(locked?" disabled":"")+'>'
    +   (state.loading[cap.id]? '<span class="spin"></span>' : ic("send",15,"currentColor"))
    +   (state.loading[cap.id]? "请求中…" : "调用")
    + '</button>';
  if(cap.id==="menuCurrent") html += '<button class="btn ghost sm" data-act="load-menu">刷新餐次列表</button>';
  if(cap.id==="invList")     html += '<button class="btn ghost sm" data-act="load-inv">刷新库存条目</button>';
  html += '</div><div class="op-res" id="res-'+esc(cap.id)+'"></div></div></div>';
  return html;
}

/* 结果面板：成功/失败/限流/加载中/空数据，一套统一 */
function renderResult(cap){
  var el = $("res-" + cap.id);
  if(!el) return;
  if(state.loading[cap.id]){
    el.innerHTML = '<div class="res"><div class="res-h"><span class="spin"></span><span class="st">请求中…</span>'
      + '<span class="meta">'+esc(cap.m+" "+cap.p)+'</span></div>'
      + '<div class="res-b"><div class="skel" style="width:70%"></div><div class="skel" style="width:45%"></div></div></div>';
    return;
  }
  var r = state.results[cap.id];
  if(!r){ el.innerHTML = ""; return; }

  if(r.validation){
    var names = [];
    for(var k in r.validation){ if(Object.prototype.hasOwnProperty.call(r.validation,k)) names.push(k + "：" + r.validation[k]); }
    el.innerHTML = '<div class="res err"><div class="res-h"><span class="st">填写校验未通过</span></div>'
      + '<div class="res-msg">'+esc(names.join("；"))+'。请在上方表单补齐后再调用。</div></div>';
    return;
  }

  var lvl = r.level || (r.ok ? "ok" : "err");
  var title = r.ok ? "调用成功" : (lvl==="warn" ? "未能完成（服务端提示）" : "调用失败");
  var html = '<div class="res '+(r.ok?"ok":lvl)+'"><div class="res-h">'
    + '<span class="st">'+(r.ok? ic("check",15,"currentColor") : "")+title+'</span>'
    + '<span class="meta">HTTP '+(r.http||"-")+' · '+r.ms+' ms'+(r.code!==null && r.code!==undefined? ' · code='+r.code : '')+'</span>'
    + '<span class="sp"></span></div>';
  html += '<div class="res-msg">'+esc(r.message||"")+'</div>';

  var sum = summaryOf(cap, r.data);
  if(r.ok && sum.length){
    html += '<div class="res-b"><div class="res-sum">';
    for(var i=0;i<sum.length;i++) html += '<div class="kv"><span class="k">'+esc(sum[i].k)+'</span><span class="v">'+esc(sum[i].v)+'</span></div>';
    html += '</div>';
    if(isEmptyData(r.data)) html += '<div class="empty-state">接口通了，但当前没有数据（空结果也是成功）</div>';
    html += '</div>';
  }
  if(r.net){
    html += '<div class="res-msg" style="padding-top:0">常见原因：后端没启动、地址填错、跨域未放行，或被浏览器/代理拦截。</div>';
  }
  if(r.raw){
    html += '<details><summary class="toggle-json">查看原始响应</summary><pre class="json">'
      + esc(typeof r.raw === "string" ? r.raw : JSON.stringify(r.raw,null,2)) + '</pre></details>';
  }
  html += '</div>';
  el.innerHTML = html;
}
/* ========================= 渲染层 2：面板 ========================= */
function capsOf(tab){
  var out = [];
  for(var i=0;i<CAPS.length;i++){ if(CAPS[i].tab===tab) out.push(CAPS[i]); }
  return out;
}
function renderPanel(tab){
  var host = $(tab + "Body");
  if(!host) return;
  var list = capsOf(tab);
  var html = "";
  for(var i=0;i<list.length;i++) html += renderOp(list[i]);
  host.innerHTML = html;
  for(var j=0;j<list.length;j++) renderResult(list[j]);
}

function renderNav(){
  var html = "";
  for(var i=0;i<TABS.length;i++){
    var t = TABS[i];
    html += '<button class="navitem'+(state.tab===t.id?" on":"")+'" data-act="goto" data-tab="'+esc(t.id)+'">'
      + ic(t.icon,15,"currentColor") + '<span>'+esc(t.label)+'</span></button>';
  }
  $("nav").innerHTML = html;
}

/* 顶栏连接胶囊 */
function renderConnChip(){
  var c = $("connChip"), txt = $("connTxt"), sub = $("appbarSub");
  var cls = "conn", label = "未连接";
  if(state.conn==="ok"){ cls += " ok"; label = state.user ? (state.user.name + " 已登录") : "已连接"; }
  else if(state.conn==="err"){ cls += " err"; label = "连接失败"; }
  else if(state.conn==="load"){ cls += " load"; label = "连接中…"; }
  c.className = cls; txt.textContent = label;
  sub.textContent = state.conn==="ok"
    ? (state.user ? (state.user.open_id + " · " + state.base) : state.base)
    : (state.connMsg || "未连接");
}

/* 连接面板：自定义连接设置 + 身份能力卡 */
function renderConn(){
  var ok = state.conn==="ok";
  var html = '<div class="card"><div class="card-h"><h2>后端地址</h2><span class="sp"></span>'
    + '<span class="tag n">默认 http://127.0.0.1:8000</span></div>'
    + '<div class="frow"><div class="lb"><span class="nm">API 基址</span><span class="req">必填</span></div>'
    + '<input type="text" id="baseInput" value="'+esc(state.base)+'" placeholder="http://127.0.0.1:8000" spellcheck="false">'
    + '<div class="ds">所有请求都会拼在这个地址后面。本页挂在 https 域下，调用 http://127.0.0.1:8000 属「本机可信来源」，浏览器默认放行；若改填局域网 IP 的 http 地址会被混合内容拦截，需给后端配 HTTPS。后端已为本页域名开启 CORS（APP__APP__CORS_ORIGINS）。</div></div>'
    + '<div class="btnrow" style="margin-top:10px">'
    + '<button class="btn primary" data-act="test-conn">'+(state.conn==="load"? '<span class="spin"></span>' : ic("plug",15,"currentColor"))+'测试连通</button>'
    + '<button class="btn ghost" data-act="save-base">保存地址</button></div>'
    + '<div id="connResult" style="margin-top:12px"></div></div>';

  html += '<div class="card"><div class="card-h"><h2>登录身份</h2><span class="sp"></span>'
    + (ok? '<span class="tag g">已登录</span>' : '<span class="tag w">未登录</span>') + '</div>';
  if(ok && state.user){
    html += '<div class="row"><div class="rf"><div class="rt">'+esc(state.user.name)+'</div>'
      + '<div class="rd">'+esc(state.user.open_id)+' · id '+esc(String(state.user.id))+'</div></div>'
      + '<button class="btn sm danger" data-act="logout">退出登录</button></div>'
      + '<p class="hint" style="margin-top:10px">已登录，其余能力已解锁。写操作（标记已做、删库存等）会真实改动数据库，调用前会二次确认。</p>';
  } else {
    html += '<div class="frow"><div class="lb"><span class="nm">昵称</span><span class="req">必填</span></div>'
      + '<input type="text" id="loginName" value="'+esc(state.loginName||"")+'" placeholder="例如：工作台用户">'
      + '<div class="ds">走 POST /api/auth/dev-login，仅在后端开启 dev_login 时可用。同一昵称复用同一账号。</div></div>'
      + '<div class="btnrow"><button class="btn primary" data-act="login">'+ic("user",15,"currentColor")+'登录并解锁能力</button></div>';
    if(state.conn==="ok") html += '<p class="hint" style="margin-top:10px">地址已通但还没登录：先登录再调用其余能力。</p>';
    else html += '<p class="hint" style="margin-top:10px">先「测试连通」，通了再登录。</p>';
  }
  html += '</div>';

  /* 身份相关的能力卡（health / providers / dev-login / me） */
  var list = capsOf("connect");
  for(var i=0;i<list.length;i++){
    html += renderOp(list[i]);
  }
  $("connectBody").innerHTML = html;
  for(var j=0;j<list.length;j++) renderResult(list[j]);
  renderConnResult();
}

function renderConnResult(){
  var el = $("connResult");
  if(!el) return;
  if(!state.connResult){ el.innerHTML = ""; return; }
  var r = state.connResult;
  var lvl = r.ok ? "ok" : "err";
  var html = '<div class="res '+lvl+'"><div class="res-h"><span class="st">'+(r.ok?"后端可用":"连不上")+'</span>'
    + '<span class="meta">HTTP '+(r.http||"-")+' · '+r.ms+' ms</span><span class="sp"></span></div>'
    + '<div class="res-msg">'+esc(r.message)+'</div>';
  var sum = summaryOf({keys:["status","database","version"]}, r.data);
  if(r.ok && sum.length){
    html += '<div class="res-b"><div class="res-sum">';
    for(var i=0;i<sum.length;i++) html += '<div class="kv"><span class="k">'+esc(sum[i].k)+'</span><span class="v">'+esc(sum[i].v)+'</span></div>';
    html += '</div></div>';
  }
  if(r.net) html += '<div class="res-msg" style="padding-top:0">检查后端是否启动、地址是否正确、以及后端是否放行了这个来源的跨域请求。</div>';
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- 统一刷新入口 ---------- */
function refreshAll(){
  renderNav();
  renderConnChip();
  renderPanel("decide");
  renderPanel("menu");
  renderPanel("fridge");
  renderPanel("pref");
  renderPanel("more");
  if(state.tab === "connect") renderConn();
}
/* ========================= 事件与初始化 ========================= */
function switchTab(id){
  state.tab = id;
  for(var i=0;i<TABS.length;i++){
    var p = $("panel-" + TABS[i].id);
    if(!p) continue;
    if(TABS[i].id === id) p.classList.add("on"); else p.classList.remove("on");
  }
  persist();
  refreshAll();
  window.scrollTo(0,0);
}

function capById(id){
  for(var i=0;i<CAPS.length;i++){ if(CAPS[i].id===id) return CAPS[i]; }
  return null;
}

/* 执行能力卡（含写操作二次确认） */
function doRun(cap){
  state.loading[cap.id] = true;
  refreshAll();
  runCap(cap, function(r){
    state.loading[cap.id] = false;
    if(r.validation){
      state.results[cap.id] = r;
      refreshAll();
      toast("请先补齐必填项");
      return;
    }
    state.results[cap.id] = r;
    if(typeof cap.after === "function"){
      try{ cap.after(r.data); }catch(e){ /* 副作用失败不影响主结果展示 */ }
    }
    refreshAll();
    if(r.ok) toast(cap.title + "：成功");
    else if(r.level === "warn") toast(cap.title + "：" + r.message);
    else toast(cap.title + "：失败（" + r.message + "）");
  });
}

function askRun(cap){
  if(cap.write){
    askConfirm("确认调用「" + cap.title + "」？",
      "这个接口会真实修改服务端数据（" + cap.m + " " + cap.p + "），且不可撤销。",
      function(){ doRun(cap); });
  } else {
    doRun(cap);
  }
}

/* 测试连通 */
function testConn(){
  state.conn = "load"; state.connMsg = "连接中…";
  renderConnChip(); if(state.tab==="connect") renderConn();
  apiRaw("GET", "/api/health", null, {}, function(r){
    state.connResult = r;
    state.conn = r.ok ? "ok" : (r.http===0 ? "err" : "err");
    state.connMsg = r.message;
    if(!r.ok && state.token){ /* 地址通但 token 可能失效时仍算已连接 */ if(r.http && r.http!==0) state.conn="err"; }
    persist();
    refreshAll();
    if(r.ok) toast("后端可用：" + r.message);
    else toast("连不上：" + r.message);
  });
}

/* 登录 */
function doLogin(){
  var name = ($("loginName") && $("loginName").value || "").trim();
  if(!name){ toast("先填昵称"); return; }
  state.loginName = name;
  apiRaw("POST", "/api/auth/dev-login", {name:name}, {}, function(r){
    if(r.ok && r.data && r.data.access_token){
      state.token = r.data.access_token;
      state.user = {id:r.data.id, name:r.data.name, open_id:r.data.open_id};
      state.conn = "ok"; state.connMsg = "已登录";
      persist();
      loadMenuItems(); loadInventory();
      refreshAll();
      toast("已登录：" + r.data.name);
    } else {
      state.results["devlogin"] = r;
      refreshAll();
      toast("登录失败：" + r.message);
    }
  });
}

function handleClick(act, el){
  var id = el.getAttribute("data-cap");
  switch(act){
    case "goto":
      switchTab(el.getAttribute("data-tab"));
      break;
    case "toggle-op":
      state.openOps[id] = !state.openOps[id];
      persist();
      refreshAll();
      break;
    case "run":
      var cap = capById(id);
      if(cap) askRun(cap);
      break;
    case "test-conn":
      var b = $("baseInput");
      if(b && b.value.trim()){ state.base = b.value.trim(); persist(); }
      testConn();
      break;
    case "save-base":
      var b2 = $("baseInput");
      if(b2 && b2.value.trim()){ state.base = b2.value.trim(); persist(); toast("地址已保存"); renderConnChip(); }
      break;
    case "login":
      doLogin();
      break;
    case "logout":
      askConfirm("退出登录？", "会清除本地保存的 token，重新登录后才能继续调用需要身份的能力。", function(){
        state.token = ""; state.user = null; state.menuItems = []; state.inventory = [];
        state.currentMenuId = null; state.conn = "idle";
        persist(); refreshAll(); toast("已退出");
      });
      break;
    case "load-menu":
      loadMenuItems(); toast("已刷新餐次列表");
      break;
    case "load-inv":
      loadInventory(); toast("已刷新库存条目");
      break;
  }
}

function bindEvents(){
  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if(!el) return;
    var act = el.getAttribute("data-act");
    if(act === "field" || act === "field-bool" || act === "field-file") return; /* 这些走 change/input */
    handleClick(act, el);
  });
  /* 表单：只更新状态，不重建 DOM，避免失焦 */
  document.addEventListener("input", function(e){
    var el = e.target, act = el.getAttribute && el.getAttribute("data-act");
    if(act === "field"){ state.formVals[el.getAttribute("data-key")] = el.value; }
  });
  document.addEventListener("change", function(e){
    var el = e.target, act = el.getAttribute && el.getAttribute("data-act");
    if(act === "field"){
      state.formVals[el.getAttribute("data-key")] = el.value;
      var row = el.closest ? el.closest(".frow") : null;
      if(row) row.classList.remove("invalid");
    } else if(act === "field-bool"){
      state.formVals[el.getAttribute("data-key")] = el.checked ? "true" : "false";
      var lb = el.parentNode.querySelector(".tl");
      if(lb) lb.textContent = el.checked ? "已开启" : "已关闭";
    } else if(act === "field-file"){
      if(el.files && el.files[0]){
        state.formVals[el.getAttribute("data-key")] = el.files[0];
        var r2 = el.closest ? el.closest(".frow") : null;
        if(r2) r2.classList.remove("invalid");
        toast("已选择：" + el.files[0].name);
      }
    }
  });
  $("mkNo").addEventListener("click", closeConfirm);
  $("mkYes").addEventListener("click", function(){ var cb = confirmCb; closeConfirm(); if(cb) cb(); });
  $("mask").addEventListener("click", function(e){ if(e.target === $("mask")) closeConfirm(); });
}

/* 校验失败时把红框标到具体字段 */
var _origRenderResult = renderResult;
renderResult = function(cap){
  _origRenderResult(cap);
  var r = state.results[cap.id];
  if(r && r.validation){
    var list = cap.f || [];
    for(var i=0;i<list.length;i++){
      if(!r.validation[list[i].k]) continue;
      var row = document.querySelector('.frow[data-frow="'+cap.id+"."+list[i].k+'"]');
      if(row){
        row.classList.add("invalid");
        var e = row.querySelector(".err");
        if(e) e.textContent = r.validation[list[i].k];
      }
    }
  }
};

function renderLogo(){
  $("logoBox").innerHTML =
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b4048" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="10" cy="11" r="4.2"/><circle cx="10" cy="11" r="1.4" fill="#E0955A" stroke="none"/>'
    + '<path d="M14.2 11h6.3a2.5 2.5 0 0 1-2.5 2.5h-2"/></svg>';
}

function init(){
  var saved = lsGet();
  if(saved.base) state.base = saved.base;
  if(saved.token) state.token = saved.token;
  if(saved.user) state.user = saved.user;
  if(saved.loginName) state.loginName = saved.loginName;
  if(saved.openOps) state.openOps = saved.openOps;
  if(saved.tab) state.tab = saved.tab;
  state.inventory = [];
  state.menuItems = [];

  renderLogo();
  bindEvents();

  /* 恢复会话：先渲染，再后台探测 */
  refreshAll();
  switchTab(state.tab);
  if(state.token){
    state.conn = "load";
    renderConnChip();
    apiRaw("GET", "/api/auth/me", null, {}, function(r){
      if(r.ok && r.data){
        state.user = {id:r.data.id, name:r.data.name, open_id:r.data.open_id};
        state.conn = "ok"; state.connMsg = "已登录";
      } else {
        state.token = ""; state.user = null; state.conn = "idle";
        state.connMsg = "登录状态已失效，请重新登录";
      }
      persist(); refreshAll();
      if(state.token){ loadMenuItems(); loadInventory(); }
    });
  } else {
    testConn();
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
