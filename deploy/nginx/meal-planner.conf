# /etc/nginx/sites-available/meal-planner.conf
# 单机部署: nginx 托管前端静态资源 + 反代 /api 到 uvicorn
# 启用: ln -s /etc/nginx/sites-available/meal-planner.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

# 登录与生成接口限流 (nginx 层兜底, 应用层另有每日配额)
limit_req_zone $binary_remote_addr zone=meal_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=meal_generate:10m rate=30r/m;

upstream meal_planner_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name meal.example.com;
    # certbot 会自动改写 80 端口为跳转; 首次签发前保持可访问
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meal.example.com;

    # certbot 签发后写入: /etc/letsencrypt/live/meal.example.com/
    ssl_certificate     /etc/letsencrypt/live/meal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # 前端构建产物
    root /srv/meal-planner/frontend/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 飞书回调可能带查询串, 不能被 SPA fallback 吃掉
    location = /api/auth/feishu/callback {
        proxy_pass http://meal_planner_api;
        include /etc/nginx/snippets/meal_planner_proxy.conf;
    }

    location = /api/auth/feishu/login-url {
        limit_req zone=meal_login burst=10 nodelay;
        proxy_pass http://meal_planner_api;
        include /etc/nginx/snippets/meal_planner_proxy.conf;
    }

    location = /api/menus/generate {
        limit_req zone=meal_generate burst=10 nodelay;
        proxy_pass http://meal_planner_api;
        include /etc/nginx/snippets/meal_planner_proxy.conf;
    }

    location /api/ {
        proxy_pass http://meal_planner_api;
        include /etc/nginx/snippets/meal_planner_proxy.conf;
    }

    location /feishu/ {
        proxy_pass http://meal_planner_api;
        include /etc/nginx/snippets/meal_planner_proxy.conf;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
