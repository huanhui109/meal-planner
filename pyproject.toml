[project]
name = "ai-meal-planner"
version = "0.2.0"
description = "AI 每周营养菜谱工具 - 基于大模型的智能菜单生成与采购辅助"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    # MySQL 8 默认 caching_sha2_password, PyMySQL 走非 TLS 连接时依赖它做 RSA 加密
    "cryptography>=42.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8.0",
    "structlog>=24.0",
    "openai>=1.50.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "lark-oapi>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]
# 可选: 更快的 MySQL 异步驱动 (需要编译, 装不上就用默认的 aiomysql)
performance = [
    "asyncmy>=0.2.9",
]
# 二期: 小象超市商品采集
scraping = [
    "playwright>=1.45.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "mysql: 需要 MySQL 测试库的集成测试",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
omit = ["backend/app/scheduler/*", "backend/app/bot/*", "backend/app/services/scraper_service.py"]
