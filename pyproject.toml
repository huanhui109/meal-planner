[project]
name = "ai-meal-planner"
version = "2.6.0"
description = "饭决 FAN·DECIDE - 今天吃啥，交给饭决。基于口味档案的即时决策引擎与轻量菜谱"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    # MySQL 8 默认 caching_sha2_password, PyMySQL 走非 TLS 连接时依赖它做 RSA 加密
    "cryptography>=42.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8.0",
    "structlog>=24.0",
    "openai>=1.50.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "lark-oapi>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    # 拍照识别: 上传的图片先等比缩放再送视觉模型, 不缩的话又慢又贵
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]
# 可选: 更快的 MySQL 异步驱动 (需要编译, 装不上就用默认的 aiomysql)
performance = [
    "asyncmy>=0.2.9",
]
# 二期: 小象超市商品采集
scraping = [
    "playwright>=1.45.0",
]
# System One 决策模型。三个包都是**按需**导入的(在函数内部 import), 不装也能
# 正常跑 —— 只是 provider=rule 兜底。见 docs/system-one-integration.md。
#
# laya 是默认后端(Apache-2.0 开源, 本地推理), 会带上 torch + transformers,
# 体积较大(约 2GB), 首次运行还要再下载 421M 权重。装不动就退回 provider=rule。
system-one = [
    "laya>=0.3.5",
    "typesafe-sdk>=0.7.0",
    "system-one-adapter[openai]>=0.2.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# conftest 里的 db_engine 是 session 级 fixture, 必须和测试跑在同一个事件循环上。
# 否则 session fixture 会跑在一个已关闭的循环里, 表现为
# "got Future attached to a different loop" 以及大量 fixture setup ERROR。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["backend/tests"]
# 让单元测试能引用仓库根下的 scripts/* (菜谱导入与营养回填脚本)
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "mysql: 需要 MySQL 测试库的集成测试",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",
    # 全库统一使用 typing.Optional/Dict/List + `from __future__ import annotations`。
    # 下面几条是「注解现代化」的纯风格偏好 (Optional[X] -> X | None 等), 与正确性无关,
    # 且批量改写会让 git 历史难以追溯, 故不强制。
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
omit = ["backend/app/scheduler/*", "backend/app/bot/*"]
